
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d19">
<title>NEDAL AI</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #111a2e;
  --line: #263550;
  --text: #edf3ff;
  --muted: #9baac4;
  --blue: #2563eb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, system-ui, sans-serif;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: var(--text);
  background: #383838;
  border: 1px solid #505050;
  border-radius: 10px;
  padding: 11px 14px;
  min-height: 42px;
}

button:hover {
  background: #454545;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.page {
  width: 100%;
  max-width: 1400px;
  margin: auto;
  padding: 12px 20px 24px;
}

.panel {
  background: transparent;
  border: 0;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: none;
}

header.panel {
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: var(--bg);
}

h1 {
  font-size: 22px;
  margin: 0 0 6px;
}

h2 {
  font-size: 17px;
  margin: 0 0 14px;
}

p {
  margin-top: 0;
}

.muted {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

input, textarea {
  display: block;
  width: 100%;
  background: #212121;
  color: var(--text);
  border: 1px solid #505050;
  border-radius: 12px;
  padding: 13px;
  margin: 8px 0 14px;
  outline: none;
}

input:focus, textarea:focus {
  border-color: #888;
}

textarea {
  resize: vertical;
  line-height: 1.7;
}

.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}

.primary:hover {
  background: #0e906f;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.row button {
  flex: 1;
}

#auth {
  max-width: 480px;
  margin: 40px auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
}

#app {
  display: none;
}

#app[style*="display: block"] {
  display: grid !important;
  grid-template-columns: 260px minmax(0, 1fr);
  grid-template-rows: auto minmax(400px, 1fr);
  gap: 12px;
  align-items: start;
}

#app > .panel:first-child {
  grid-column: 1 / -1;
  grid-row: 1;
  border-bottom: 1px solid var(--line);
}

#app > .panel:nth-child(2) {
  grid-column: 1;
  grid-row: 2;
  background: #181818;
  border-radius: 14px;
  min-height: 400px;
}

#app > .panel:nth-child(3) {
  grid-column: 2;
  grid-row: 2;
  min-width: 0;
  max-width: 850px;
  width: 100%;
  margin: 0 auto;
}

#history {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-item {
  display: flex;
  gap: 5px;
}

.history-item button:first-child {
  flex: 1;
  min-width: 0;
  text-align: right;
  overflow-wrap: anywhere;
  background: transparent;
  border-color: transparent;
}

.history-item button:last-child {
  padding: 8px;
}
#messages {
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 250px;
  max-height: 60vh;
  overflow-y: auto;
  padding: 20px 8px;
  margin-bottom: 18px;
  scroll-behavior: smooth;
}

.message {
  padding: 14px 18px;
  border-radius: 18px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.9;
  border: 1px solid #263550;
}

.user {
  background: #1b2b49;
  border-color: #304b78;
  align-self: flex-start;
  max-width: 90%;
}

.assistant {
  background: #111a2e;
  align-self: stretch;
}

#prompt {
  min-height: 110px;
  background: #111a2e;
  border: 1px solid #304362;
  border-radius: 16px;
  padding: 16px;
  line-height: 1.8;
}

#prompt:focus {
  border-color: #2563eb;
  outline: 1px solid #2563eb;
}

@media (max-width: 700px) {
  #messages {
    max-height: 50vh;
    padding: 14px 4px;
  }

  #prompt {
    min-height: 90px;
  }
}
#status {
  white-space: pre-wrap;
  color: #f5cf7b;
  font-size: 14px;
  line-height: 1.7;
  margin-top: 10px;
}

label {
  display: block;
  color: #d4d4d4;
  font-size: 14px;
}

.hidden {
  display: none !important;
}

@media (max-width: 700px) {
  .page {
    padding: 8px;
  }

  header.panel {
    padding: 12px;
  }

  #app[style*="display: block"] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto;
    gap: 4px;
  }

  #app > .panel:first-child {
    grid-column: 1;
    grid-row: 1;
  }

  #app > .panel:nth-child(2) {
    grid-column: 1;
    grid-row: 2;
    min-height: auto;
    max-height: 220px;
    overflow-y: auto;
  }

  #app > .panel:nth-child(3) {
    grid-column: 1;
    grid-row: 3;
    padding: 10px 4px;
  }

  #messages {
    max-height: 45vh;
  }

  .panel {
    padding: 12px;
  }
}
</style>
</head>
<body>
<main class="page">
  <header class="panel">
    <h1>✦ NEDAL AI</h1>
    <p class="muted">أهلًا بك في NEDAL AI — مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</p>
  </header>

  <section id="auth" class="panel">
    <h2>تسجيل الدخول أو إنشاء حساب</h2>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
    <div class="row">
      <button class="primary" id="signup">إنشاء حساب</button>
      <button id="login">تسجيل الدخول</button>
    </div>
    <p id="authStatus" class="muted"></p>
  </section>

  <section id="app">
    <div class="panel">
      <div class="row">
        <button id="newChat" class="primary">＋ محادثة جديدة</button>
        <button id="logout">تسجيل الخروج</button>
      </div>
      <p id="userLabel" class="muted"></p>
    </div>

    <div class="panel">
      <h2>محادثاتي</h2>
      <div id="history"></div>
    </div>

    <div class="panel">
      <h2 id="chatTitle">محادثة جديدة</h2>
      <div id="messages"></div>
      <label for="prompt">اكتب رسالتك</label>
      <textarea id="prompt" rows="3" placeholder="كيف يمكنني مساعدتك؟"></textarea>
      <div class="row">
        <button id="send" class="primary">إرسال</button>
        <button id="clearChat">مسح المحادثة</button>
      </div>
      <p id="status"></p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* إعدادات مشروعك */
const SUPABASE_URL = "https://kqonanuvfgddnrjjqesr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_hueVbdQ1oxY5qhUAYhaVig_5JS-ENjO";
const AI_API = "https://little-king-48cf.nedaljadaan3.workers.dev";
const STORAGE_KEY = "nedal_ai_conversations_v1";

const $ = id => document.getElementById(id);
const authBox = $("auth");
const appBox = $("app");
let supabaseClient = null;
let currentUser = null;
let conversations = [];
let activeId = null;
let busy = false;

function showAuth(message="") {
  authBox.style.display = "block";
  appBox.style.display = "none";
  $("authStatus").textContent = message;
}

function showApp() {
  authBox.style.display = "none";
  appBox.style.display = "block";
  $("userLabel").textContent = currentUser?.email || "";
}

function status(message) {
  $("status").textContent = message;
}

function escapeError(error) {
  return error?.message || String(error || "حدث خطأ غير معروف");
}

function loadLocal() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  } catch {
    status("تعذر الحفظ المحلي في المتصفح.");
  }
}

function makeId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "c-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

function newConversation() {
  const c = {
    id: makeId(),
    title: "محادثة جديدة",
    messages: [],
    created_at: new Date().toISOString()
  };
  conversations.unshift(c);
  activeId = c.id;
  saveLocal();
  renderAll();
}

function activeConversation() {
  return conversations.find(c => c.id === activeId);
}

function renderHistory() {
  const box = $("history");
  box.replaceChildren();

  if (!conversations.length) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "لا توجد محادثات بعد.";
    box.appendChild(p);
    return;
  }

  conversations.forEach(c => {
    const line = document.createElement("div");
    line.className = "history-item";

    const open = document.createElement("button");
    open.textContent = c.title || "محادثة جديدة";
    open.onclick = () => {
      activeId = c.id;
      renderAll();
    };

    const del = document.createElement("button");
    const rename = document.createElement("button");
rename.textContent = "تسمية";
rename.title = "تغيير اسم المحادثة";

rename.onclick = async () => {
  const proposed = prompt(
    "اكتب اسمًا جديدًا للمحادثة:",
    c.title || ""
  );

  if (proposed === null) return;

  const title = proposed.trim().slice(0, 60);

  if (!title) {
    alert("اكتب اسمًا للمحادثة أولًا.");
    return;
  }

  c.title = title;
  saveLocal();
  renderAll();
  await saveConversationToCloud(c);
  status("تم تحديث اسم المحادثة.");
};
    del.textContent = "حذف";
    del.onclick = () => {
      const rename = document.createElement("button");
rename.textContent = "تسمية";
rename.title = "تغيير اسم المحادثة";

rename.onclick = async () => {
  const proposed = prompt(
    "اكتب اسمًا جديدًا للمحادثة:",
    c.title || ""
  );

  if (proposed === null) return;

  const title = proposed.trim().slice(0, 60);

  if (!title) {
    alert("اكتب اسمًا للمحادثة أولًا.");
    return;
  }

  c.title = title;
  saveLocal();
  renderAll();
  await saveConversationToCloud(c);
  status("تم تحديث اسم المحادثة.");
};
      conversations = conversations.filter(x => x.id !== c.id);
      if (activeId === c.id) activeId = conversations[0]?.id || null;
      saveLocal();
      renderAll();
    };

    line.append(open, rename, del);
    box.appendChild(line);
  });
}

function renderMessages() {
  const box = $("messages");
  box.replaceChildren();
  const c = activeConversation();

  $("chatTitle").textContent = c?.title || "محادثة جديدة";

  if (!c || !c.messages.length) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "ابدأ محادثة جديدة بكتابة رسالتك.";
    box.appendChild(p);
    return;
  }

  c.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "message " +
      (m.role === "user" ? "user" : "assistant");
    div.textContent = m.content;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function renderAll() {
  renderHistory();
  renderMessages();
}

function setupSupabase() {
  if (!window.supabase?.createClient) {
    throw new Error("تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت.");
  }
  if (
    !SUPABASE_PUBLISHABLE_KEY ||
    SUPABASE_PUBLISHABLE_KEY.includes("ضع_مفتاح")
  ) {
    throw new Error("لم تضع مفتاح Supabase الصحيح داخل الكود.");
  }
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
}

async function signUp() {
  try {
    setupSupabase();
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) {
      $("authStatus").textContent = "أدخل البريد الإلكتروني وكلمة المرور.";
      return;
    }
    $("authStatus").textContent = "جارٍ إنشاء الحساب...";
    const {data, error} = await supabaseClient.auth.signUp({
      email, password
    });
    if (error) throw error;

    if (!data.session) {
      $("authStatus").textContent =
        "تم إرسال طلب التسجيل. تحقق من بريدك الإلكتروني لتأكيد الحساب.";
      return;
    }
    currentUser = data.user;
    await startApp();
  } catch (e) {
    $("authStatus").textContent = "تعذر إنشاء الحساب: " + escapeError(e);
  }
}

async function signIn() {
  try {
    setupSupabase();
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) {
      $("authStatus").textContent = "أدخل البريد الإلكتروني وكلمة المرور.";
      return;
    }
    $("authStatus").textContent = "جارٍ تسجيل الدخول...";
    const {data, error} = await supabaseClient.auth.signInWithPassword({
      email, password
    });
    if (error) throw error;
    currentUser = data.user;
    await startApp();
  } catch (e) {
    $("authStatus").textContent = "تعذر تسجيل الدخول: " + escapeError(e);
  }
}

async function startApp() {
  showApp();
  conversations = loadLocal();
  activeId = conversations[0]?.id || null;
  if (!activeId) newConversation();
  renderAll();
  await loadCloudConversations();
}

async function loadCloudConversations() {
  if (!supabaseClient || !currentUser) return;
  try {
    const {data: rows, error} = await supabaseClient
      .from("conversations")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", {ascending: false});

    if (error) throw error;
    if (!rows?.length) return;

    const cloud = [];
    for (const row of rows) {
      const {data: msgs, error: msgError} = await supabaseClient
        .from("messages")
        .select("*")
        .eq("conversation_id", row.id)
        .order("created_at", {ascending: true});

      if (msgError) throw msgError;
      cloud.push({
        id: row.id,
        title: row.title || "محادثة جديدة",
        created_at: row.created_at,
        messages: (msgs || []).map(m => ({
          role: m.role,
          content: m.content
        }))
      });
    }

    // لا تستبدل محادثة محلية تحمل رسائل غير محفوظة.
    for (const c of cloud) {
      const index = conversations.findIndex(x => x.id === c.id);
      if (index < 0) conversations.push(c);
      else if (!conversations[index].messages?.length) conversations[index] = c;
    }

    saveLocal();
    if (!activeId || !conversations.some(c => c.id === activeId)) {
      activeId = conversations[0]?.id || null;
    }
    renderAll();
  } catch (e) {
    status("تعذر تحميل المحادثات السحابية: " + escapeError(e));
  }
}

async function saveConversationToCloud(c) {
  if (!supabaseClient || !currentUser || !c) return;
  try {
    const {error: convError} = await supabaseClient
      .from("conversations")
      .upsert({
        id: c.id,
        user_id: currentUser.id,
        title: c.title || "محادثة جديدة"
      }, {onConflict: "id"});

    if (convError) throw convError;

    // يستخدم هذا الإصدار الرسائل الجديدة فقط عند إرسالها.
    // لا يحذف الرسائل الموجودة في قاعدة البيانات.
    if (c._pendingMessages?.length) {
      const rows = c._pendingMessages.map(m => ({
        conversation_id: c.id,
        user_id: currentUser.id,
        role: m.role,
        content: m.content
      }));

      const {error: msgError} = await supabaseClient
        .from("messages")
        .insert(rows);

      if (msgError) throw msgError;
      c._pendingMessages = [];
    }
  } catch (e) {
    status("تم الحفظ محليًا، لكن المزامنة السحابية لم تنجح: " +
      escapeError(e));
  }
}

async function sendMessage() {
  if (busy) return;
  const text = $("prompt").value.trim();
  if (!text) return;

  if (!activeConversation()) newConversation();
  const c = activeConversation();
  if (!c) return;

  busy = true;
  $("send").disabled = true;
  $("prompt").value = "";
  status("جارٍ إرسال الرسالة...");

  const userMessage = {role: "user", content: text};
  c.messages.push(userMessage);
  c._pendingMessages = c._pendingMessages || [];
  c._pendingMessages.push(userMessage);

  if (c.title === "محادثة جديدة") {
    c.title = text.slice(0, 45);
  }
  saveLocal();
  renderAll();

  try {
    await saveConversationToCloud(c);

    const history = c.messages.map(m => ({
      role: m.role,
      content: m.content
    }));

    const response = await fetch(AI_API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history})
    });

    const raw = await response.text();
    if (!response.ok) {
      throw new Error("خادم الذكاء الاصطناعي: HTTP " + response.status);
    }

    let answer = raw;
    try {
      const data = JSON.parse(raw);
      answer = data.reply || data.answer || data.response ||
        data.message || raw;
    } catch {}

    const botMessage = {role: "assistant", content: String(answer)};
    c.messages.push(botMessage);
    c._pendingMessages = c._pendingMessages || [];
    c._pendingMessages.push(botMessage);

    saveLocal();
    renderAll();
    await saveConversationToCloud(c);
    status("تم الرد.");
  } catch (e) {
    status("تعذر الحصول على الرد: " + escapeError(e));
    saveLocal();
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

$("signup").addEventListener("click", signUp);
$("login").addEventListener("click", signIn);
$("send").addEventListener("click", sendMessage);

$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

$("newChat").addEventListener("click", newConversation);

$("clearChat").addEventListener("click", () => {
  const c = activeConversation();
  if (!c) return;
  if (!confirm("هل تريد مسح رسائل هذه المحادثة؟")) return;
  c.messages = [];
  c._pendingMessages = [];
  saveLocal();
  renderAll();
});

$("logout").addEventListener("click", async () => {
  if (supabaseClient) await supabaseClient.auth.signOut();
  currentUser = null;
  showAuth("تم تسجيل الخروج.");
});

(async function init() {
  try {
    setupSupabase();
    const {data, error} = await supabaseClient.auth.getSession();
    if (error) throw error;
    if (data.session) {
      currentUser = data.session.user;
      await startApp();
    } else {
      showAuth();
    }
  } catch (e) {
    showAuth("إعداد الاتصال يحتاج إلى مراجعة: " + escapeError(e));
  }
})();
</script>
</body>
</html>
