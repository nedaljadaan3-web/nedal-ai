
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d19">
<title>NEDAL AI - نضال</title>
<style>
:root{color-scheme:dark;--bg:#090d19;--panel:#121a2c;--line:#293650;--text:#f4f6ff;--muted:#9aa9c4;--blue:#6685ff;--purple:#a36cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#20234a,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,textarea{font:inherit}
button{cursor:pointer}
.layout{min-height:100dvh;max-width:1100px;margin:auto;display:flex}
.sidebar{width:255px;flex-shrink:0;background:#0d1322;border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:900;font-size:23px}
.brand h1{font-size:18px;margin:0}
.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px;border-radius:12px;text-align:center}
.btn.primary{background:linear-gradient(135deg,#5278ed,#8658d6);border:0}
.btn:hover{border-color:var(--blue)}
.side-title{font-size:12px;color:var(--muted);margin-top:12px}
.history{display:flex;flex-direction:column;gap:7px;overflow:auto;max-height:55vh}
.history-item{display:flex;align-items:center;gap:5px}
.history-open{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;background:transparent;border:0;color:#dce4fa;padding:10px 6px;border-radius:8px}
.history-open.active,.history-open:hover{background:#202b43}
.delete{background:transparent;border:0;color:#8794ad;padding:7px}
.note{font-size:11px;color:#7888a6;line-height:1.8;margin-top:auto}
.main{min-width:0;flex:1;display:flex;flex-direction:column;min-height:100dvh;padding:18px}
.welcome{text-align:center;padding:48px 10px 26px}
.orb{font-size:35px;width:72px;height:72px;margin:auto auto 17px;display:grid;place-items:center;border-radius:23px;background:linear-gradient(135deg,#2b4b96,#653d9c)}
.welcome h2{font-size:clamp(24px,5vw,35px);margin:0 0 12px}
.welcome h2 span{background:linear-gradient(90deg,#78a6ff,#c89aff);background-clip:text;color:transparent}
.welcome p{color:var(--muted);font-size:14px;line-height:1.9;max-width:450px;margin:0 auto}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:20px}
.suggestion{text-align:right;background:#11192b;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px}
.suggestion strong{display:block;margin-bottom:5px}
.suggestion small{color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:16px;flex:1;padding:8px 0 20px}
.message{max-width:90%;padding:13px 15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:16px}
.user{align-self:flex-start;background:linear-gradient(135deg,#334d91,#49377b);border-bottom-left-radius:5px}
.assistant{align-self:stretch;background:#121a2b;border:1px solid var(--line);border-bottom-right-radius:5px}
.label{display:block;color:#aebfff;font-size:12px;font-weight:700;margin-bottom:6px}
.copy{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 9px;margin-top:10px;font-size:12px}
.status{font-size:13px;color:#ffb6b6;padding:4px 0}
.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 15%);padding:12px 0 6px}
.inputbox{display:flex;align-items:flex-end;gap:8px;background:#121a2b;border:1px solid #354463;border-radius:17px;padding:9px}
textarea{flex:1;min-width:0;resize:none;max-height:140px;min-height:42px;border:0;outline:0;background:transparent;color:white;padding:10px;line-height:1.6}
textarea::placeholder{color:#8291ac}
.send{width:44px;height:44px;flex-shrink:0;border:0;border-radius:13px;color:white;background:linear-gradient(135deg,var(--blue),var(--purple));font-size:20px}
.send:disabled{opacity:.5}
.hint{text-align:center;color:#7f8ba6;font-size:11px;padding-top:10px}
footer{text-align:center;color:#6f7c96;font-size:11px;padding:14px 0}
.hidden{display:none!important}
@media(max-width:650px){
.layout{display:block}
.sidebar{width:auto;border-left:0;border-bottom:1px solid var(--line);padding:12px;gap:9px}
.brand{margin:0}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sidebar-top .btn{padding:9px;font-size:12px}
.side-title{margin-top:4px}
.history{flex-direction:row;max-height:none;overflow-x:auto;padding-bottom:3px}
.history-item{min-width:145px;max-width:190px;background:#141d30;border-radius:10px}
.history-open{font-size:12px}
.delete{padding:4px}
.note{display:none}
.main{min-height:65vh;padding:12px}
.welcome{padding:30px 5px 22px}
.suggestions{gap:8px}
.suggestion{padding:11px;font-size:13px}
.suggestion small{font-size:11px}
.message{max-width:97%}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>NEDAL AI</h1>
        <p>نضال - مساعدك الذكي</p>
      </div>
    </div>
    <button class="btn primary" id="newChat">＋ جديد</button>
  </div>

  <div class="side-title">📚 سجل المحادثات</div>
  <div class="history" id="history"></div>
  <button class="btn" id="clearHistory">🗑️ حذف كل المحادثات</button>
  <div class="note">تُحفظ محادثاتك في هذا المتصفح على جهازك. لا تشارك معلوماتك السرية.</div>
</aside>

<main class="main">
  <section class="welcome" id="welcome">
    <div class="orb">✦</div>
    <h2>أهلًا بك في <span>NEDAL AI</span></h2>
    <p>أنا نضال، مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</p>
  </section>

  <section class="suggestions" id="suggestions">
    <button class="suggestion" data-prompt="علّمني اللغة الألمانية للمبتدئين بالعربية">
      <strong>🌍 تعلّم الألمانية</strong>
      <small>ابدأ من المستوى A1</small>
    </button>
    <button class="suggestion" data-prompt="ساعدني في كتابة رسالة رسمية باللغة الألمانية">
      <strong>✍️ كتابة النصوص</strong>
      <small>رسائل ونصوص احترافية</small>
    </button>
    <button class="suggestion" data-prompt="اقترح لي أفكارًا لمشروع صغير بميزانية محدودة">
      <strong>💡 أفكار ومشاريع</strong>
      <small>خطط عملية جديدة</small>
    </button>
    <button class="suggestion" data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة">
      <strong>🧠 تعلّم واكتشف</strong>
      <small>شرح مبسّط للمعلومات</small>
    </button>
  </section>

  <section class="chat" id="chat" aria-live="polite"></section>
  <div class="status" id="status" role="status"></div>

  <section class="composer">
    <div class="inputbox">
      <textarea id="message" rows="1" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك"></textarea>
      <button class="send" id="send" aria-label="إرسال">➤</button>
    </div>
    <div class="hint">اضغط Enter للإرسال · Shift + Enter لسطر جديد</div>
  </section>

  <footer>© 2026 NEDAL AI · نضال، مساعدك الذكي</footer>
</main>
</div>

<script>
const API = "https://little-king-48cf.nedaljadaan3.workers.dev";
const STORAGE_KEY = "nedal_ai_conversations_v1";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const send = document.getElementById("send");
const statusBox = document.getElementById("status");
const welcome = document.getElementById("welcome");
const suggestions = document.getElementById("suggestions");
const historyBox = document.getElementById("history");

let conversations = loadConversations();
let currentId = null;
let busy = false;

function loadConversations() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch {
    return [];
  }
}

function saveConversations() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  } catch {
    statusBox.textContent = "تعذّر الحفظ في المتصفح. قد تكون مساحة التخزين ممتلئة.";
  }
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function currentConversation() {
  return conversations.find(c => c.id === currentId);
}

function createConversation() {
  const c = {
    id: makeId(),
    title: "محادثة جديدة",
    messages: [],
    updated: Date.now()
  };
  conversations.unshift(c);
  currentId = c.id;
  saveConversations();
  renderHistory();
  renderConversation();
  return c;
}

function ensureConversation(text) {
  let c = currentConversation();
  if (!c) c = createConversation();

  if (!c.messages.length) {
    c.title = text.replace(/\s+/g, " ").slice(0, 34) || "محادثة جديدة";
  }

  c.updated = Date.now();
  return c;
}

function renderHistory() {
  historyBox.replaceChildren();
  conversations.sort((a, b) => b.updated - a.updated);

  conversations.forEach(c => {
    const row = document.createElement("div");
    row.className = "history-item";

    const open = document.createElement("button");
    open.className = "history-open" + (c.id === currentId ? " active" : "");
    open.textContent = "💬 " + (c.title || "محادثة جديدة");
    open.title = c.title || "محادثة جديدة";

    open.addEventListener("click", () => {
      currentId = c.id;
      statusBox.textContent = "";
      renderHistory();
      renderConversation();
    });

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "×";
    del.title = "حذف هذه المحادثة";
    del.setAttribute("aria-label", "حذف المحادثة");

    del.addEventListener("click", () => {
      if (!confirm("هل تريد حذف هذه المحادثة؟")) return;

      conversations = conversations.filter(item => item.id !== c.id);

      if (currentId === c.id) currentId = null;

      saveConversations();
      renderHistory();
      renderConversation();
    });

    row.append(open, del);
    historyBox.appendChild(row);
  });
}

function renderConversation() {
  chat.replaceChildren();

  const c = currentConversation();
  const hasMessages = !!(c && c.messages.length);

  welcome.classList.toggle("hidden", hasMessages);
  suggestions.classList.toggle("hidden", hasMessages);

  if (!c) return;

  c.messages.forEach(m => {
    addMessageElement(m.content, m.role, false);
  });
}

function addMessageElement(text, role, scroll = true) {
  const box = document.createElement("div");
  box.className = "message " + (role === "user" ? "user" : "assistant");

  if (role !== "user") {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "✦ نضال AI";
    box.appendChild(label);
  }

  const content = document.createElement("div");
  content.textContent = text;
  box.appendChild(content);

  if (role !== "user") {
    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "📋 نسخ الإجابة";

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
        copy.textContent = "تم النسخ ✓";
      } catch {
        copy.textContent = "تعذّر النسخ";
      }
    });

    box.appendChild(copy);
  }

  chat.appendChild(box);

  if (scroll) {
    box.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  return box;
}

function addSavedMessage(role, content) {
  const c = currentConversation();
  if (!c) return;

  c.messages.push({ role, content });
  c.updated = Date.now();

  saveConversations();
  renderHistory();
}

async function askAI() {
  if (busy) return;

  const message = input.value.trim();
  if (!message) return;

  const c = ensureConversation(message);
  currentId = c.id;

  addSavedMessage("user", message);

  busy = true;
  send.disabled = true;
  input.disabled = true;
  statusBox.textContent = "";

  welcome.classList.add("hidden");
  suggestions.classList.add("hidden");

  addMessageElement(message, "user");

  input.value = "";
  input.style.height = "43px";

  const waiting = addMessageElement(
    "لحظة من فضلك، أفكّر في إجابتك...",
    "assistant"
  );

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("وصل رد غير مفهوم من الخدمة.");
    }

    if (!response.ok) {
      throw new Error(data.error || "خطأ في الخدمة: " + response.status);
    }

    if (!data.reply) {
      throw new Error(data.error || "لم تصل إجابة من الذكاء الاصطناعي.");
    }

    waiting.remove();

    addSavedMessage("assistant", data.reply);
    addMessageElement(data.reply, "assistant");

  } catch (error) {
    waiting.remove();

    const msg = "تعذّر الحصول على إجابة. سبب الخطأ: " +
      (error.message || "خطأ غير معروف");

    addSavedMessage("assistant", msg);
    addMessageElement(msg, "assistant");

    statusBox.textContent =
      "تحقق من الإنترنت أو خدمة الذكاء الاصطناعي.";

  } finally {
    busy = false;
    send.disabled = false;
    input.disabled = false;
    input.focus();
    renderHistory();
  }
}

function newChat() {
  currentId = null;
  statusBox.textContent = "";
  input.value = "";
  renderConversation();
  renderHistory();
  input.focus();
}

document.getElementById("newChat").addEventListener("click", newChat);

document.getElementById("send").addEventListener("click", askAI);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    askAI();
  }
});

input.addEventListener("input", () => {
  input.style.height = "43px";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

suggestions.addEventListener("click", event => {
  const btn = event.target.closest("[data-prompt]");
  if (!btn) return;

  input.value = btn.dataset.prompt;
  askAI();
});

document.getElementById("clearHistory").addEventListener("click", () => {
  if (!confirm("هل تريد حذف جميع المحادثات المحفوظة؟ لا يمكن التراجع عن هذا الإجراء.")) {
    return;
  }

  conversations = [];
  currentId = null;

  saveConversations();
  renderHistory();
  renderConversation();

  statusBox.textContent = "تم حذف المحادثات من هذا المتصفح.";
});

renderHistory();
renderConversation();
</script>
</body>
</html>
