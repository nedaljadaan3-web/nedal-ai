
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEDAL AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }
    main { max-width: 650px; margin: auto; }
    h1 { text-align: center; color: #75a7ff; }
    .subtitle { text-align: center; color: #c4cee2; }
    #chat {
      height: 55vh;
      min-height: 280px;
      overflow-y: auto;
      padding: 12px;
      margin: 20px 0;
      background: #151d32;
      border: 1px solid #34425f;
      border-radius: 14px;
    }
    .msg {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
    .user { background: #243d68; }
    .ai { background: #202a40; }
    form { display: flex; gap: 8px; }
    textarea {
      flex: 1;
      min-width: 0;
      padding: 12px;
      font-size: 16px;
      color: white;
      background: #151d32;
      border: 1px solid #465574;
      border-radius: 10px;
    }
    button {
      padding: 12px 16px;
      background: #477cf5;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    button:disabled { opacity: .6; }
    #status { color: #c4cee2; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>NEDAL AI</h1>
  <p class="subtitle">مساعدك الذكي — اسألني ما تريد</p>

  <div id="chat" aria-live="polite">
    <div class="msg ai">مرحبًا! أنا NEDAL AI. اكتب سؤالك لنبدأ.</div>
  </div>

  <form id="form">
    <textarea id="question" rows="2"
      placeholder="اكتب سؤالك هنا..." required></textarea>
    <button id="send" type="submit">إرسال</button>
  </form>
  <p id="status">جاهز لاستقبال سؤالك</p>
</main>

<script>
const API = "https://little-king-48cf.nedaljadaan3.workers.dev";
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const question = document.getElementById("question");
const send = document.getElementById("send");
const status = document.getElementById("status");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = question.value.trim();
  if (!message) return;

  addMessage(message, "user");
  question.value = "";
  send.disabled = true;
  status.textContent = "جارٍ الاتصال بالذكاء الاصطناعي...";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    const raw = await response.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("استجابة غير مفهومة من Cloudflare: " + raw.slice(0, 250));
    }

    if (!response.ok) {
      throw new Error(data.error || "خطأ HTTP " + response.status);
    }

    if (data.error) throw new Error(data.error);

    addMessage(data.reply || "لم يصل رد من الذكاء الاصطناعي.", "ai");
    status.textContent = "تم الرد";

  } catch (error) {
    addMessage("سبب الخطأ: " + (error.message || String(error)), "ai");
    status.textContent = "فشل الاتصال. اقرأ رسالة الخطأ أعلاه.";
  } finally {
    send.disabled = false;
    question.focus();
  }
});
</script>
</body>
</html>
