
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEDAL AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #0b1020; color: white;
      min-height: 100vh; display: flex;
      justify-content: center; padding: 20px;
    }
    main { width: 100%; max-width: 650px; }
    h1 { text-align: center; color: #75a7ff; }
    .sub { text-align: center; color: #bbc5dc; }
    #chat {
      height: 55vh; min-height: 280px; overflow-y: auto;
      background: #151d32; border: 1px solid #2b3855;
      border-radius: 16px; padding: 14px; margin: 20px 0;
    }
    .msg {
      white-space: pre-wrap; overflow-wrap: anywhere;
      padding: 12px; margin: 10px 0; border-radius: 12px;
      line-height: 1.6;
    }
    .user { background: #243d68; }
    .ai { background: #202a40; }
    form { display: flex; gap: 8px; }
    textarea {
      flex: 1; min-width: 0; resize: vertical;
      border-radius: 12px; padding: 12px; font-size: 16px;
      color: white; background: #151d32; border: 1px solid #465574;
    }
    button {
      border: 0; border-radius: 12px; padding: 12px 18px;
      background: #477cf5; color: white; font-size: 16px;
    }
    button:disabled { opacity: .5; }
    #status { color: #bbc5dc; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
<main>
  <h1>NEDAL AI</h1>
  <p class="sub">مساعدك الذكي — اسألني ما تريد</p>
  <div id="chat" aria-live="polite">
    <div class="msg ai">مرحبًا! أنا NEDAL AI. اكتب سؤالك لنبدأ.</div>
  </div>
  <form id="form">
    <textarea id="question" rows="2" placeholder="اكتب سؤالك هنا..." required></textarea>
    <button id="send" type="submit">إرسال</button>
  </form>
  <p id="status">جاهز لاستقبال سؤالك</p>
</main>
<script>
  const API = "https://little-king-48cf.nedaljadaan3.workers.dev";
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const question = document.getElementById("question");
  const send = document.getElementById("send");
  const status = document.getElementById("status");

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = question.value.trim();
    if (!message) return;

    addMessage(message, "user");
    question.value = "";
    send.disabled = true;
    status.textContent = "NEDAL AI يفكر...";

    try {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error(data.error || "حدث خطأ في الخدمة");
      }
      addMessage(data.reply || "لم يصل رد من الخدمة.", "ai");
      status.textContent = "تم الرد";
    } catch (error) {
      addMessage("تعذر الحصول على إجابة. تأكد من نشر خدمة Cloudflare وإعداد AI.", "ai");
      status.textContent = "حدث خطأ في الاتصال";
    } finally {
      send.disabled = false;
      question.focus();
    }
  });
</script>
</body>
</html>
