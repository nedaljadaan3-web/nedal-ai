
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d19">
<title>NEDAL AI</title>
<style>

:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #151c2e;
  --line: #2a3550;
  --text: #f4f6ff;
  --muted: #a6b1c9;
  --blue: #7167f9;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, #20264b 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  transition: background .2s, transform .2s, border-color .2s;
}

button:hover {
  border-color: #8178ff;
  transform: translateY(-1px);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

.page {
  width: min(100%, 960px);
  margin: auto;
  padding: 24px 16px 40px;
}

.panel {
  background: rgba(21, 28, 46, .92);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, .16);
}

header.panel {
  background: linear-gradient(135deg, #24264c, #151c2e);
  border-color: #45416f;
}

h1, h2, p {
  margin-top: 0;
}

h1 {
  font-size: clamp(25px, 5vw, 34px);
  margin-bottom: 8px;
  letter-spacing: -.5px;
}

h2 {
  font-size: 19px;
  margin-bottom: 16px;
}

.muted {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

input, textarea {
  display: block;
  width: 100%;
  background: #0d1324;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin: 8px 0 16px;
  outline: none;
}

input:focus, textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(113, 103, 249, .15);
}

textarea {
  resize: vertical;
  line-height: 1.7;
}

button {
  border: 1px solid var(--line);
  background: #222d46;
  color: white;
  padding: 12px 16px;
  border-radius: 13px;
  min-height: 44px;
}

.primary {
  background: linear-gradient(135deg, #8175ff, #5d5ce2);
  border: 0;
  color: white;
  font-weight: 650;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.row button {
  flex: 1;
}

#app {
  display: none;
}

#history {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.history-item {
  display: flex;
  gap: 8px;
}

.history-item button:first-child {
  flex: 1;
  text-align: right;
  overflow-wrap: anywhere;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 150px;
  max-height: 55vh;
  overflow-y: auto;
  padding: 4px 2px 14px;
  margin-bottom: 18px;
}

.message {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 17px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.9;
}

.user {
  background: #293568;
  border-color: #414e91;
  align-self: flex-start;
  max-width: 95%;
}

.assistant {
  background: #1b263b;
  align-self: stretch;
}

#status {
  white-space: pre-wrap;
  font-size: 14px;
  color: #f5cf7b;
  margin-top: 12px;
  line-height: 1.7;
}

label {
  display: block;
  color: #dbe2f6;
  font-size: 14px;
}

.hidden {
  display: none !important;
}

@media (max-width: 600px) {
  .page {
    padding: 12px 10px 28px;
  }

  .panel {
    padding: 16px;
    border-radius: 18px;
    margin-bottom: 12px;
  }

  .row {
    gap: 8px;
  }

  .row button {
    min-width: 110px;
    padding: 11px 10px;
  }

  #messages {
    max-height: 50vh;
  }
}

</style>
</head>
<body>
<main class="page">
  <header class="panel">
    <h1>✦ NEDAL AI</h1>
    <p class="muted">مساعدك الذكي باللغة العربية</p>
  </header>

  <section id="auth" class="panel">
    <h2>تسجيل الدخول أو إنشاء حساب</h2>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
    <div class="row">
      <button class="primary" id="signup">إنشاء حساب</button>
      <button id="login">تسجيل الدخول</button>
    </div>
    <p id="authStatus" class="muted"></p>
  </section>

  <section id="app">
    <div class="panel">
      <div class="row">
        <button id="newChat" class="primary">＋ محادثة جديدة</button>
        <button id="logout">تسجيل الخروج</button>
      </div>
      <p id="userLabel" class="muted"></p>
    </div>

    <div class="panel">
      <h2>محادثاتي</h2>
      <div id="history"></div>
    </div>

    <div class="panel">
      <h2 id="chatTitle">محادثة جديدة</h2>
      <div id="messages"></div>
      <label for="prompt">اكتب رسالتك</label>
      <textarea id="prompt" rows="3" placeholder="كيف يمكنني مساعدتك؟"></textarea>
      <div class="row">
        <button id="send" class="primary">إرسال</button>
        <button id="clearChat">مسح المحادثة</button>
      </div>
      <p id="status"></p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* إعدادات مشروعك */
const SUPABASE_URL = "https://kqonanuvfgddnrjjqesr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_hueVbdQ1oxY5qhUAYhaVig_5JS-ENjO";
const AI_API = "https://little-king-48cf.nedaljadaan3.workers.dev";
const STORAGE_KEY = "nedal_ai_conversations_v1";

const $ = id => document.getElementById(id);
const authBox = $("auth");
const appBox = $("app");
let supabaseClient = null;
let currentUser = null;
let conversations = [];
let activeId = null;
let busy = false;

function showAuth(message="") {
  authBox.style.display = "block";
  appBox.style.display = "none";
  $("authStatus").textContent = message;
}

function showApp() {
  authBox.style.display = "none";
  appBox.style.display = "block";
  $("userLabel").textContent = currentUser?.email || "";
}

function status(message) {
  $("status").textContent = message;
}

function escapeError(error) {
  return error?.message || String(error || "حدث خطأ غير معروف");
}

function loadLocal() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  } catch {
    status("تعذر الحفظ المحلي في المتصفح.");
  }
}

function makeId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "c-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

function newConversation() {
  const c = {
    id: makeId(),
    title: "محادثة جديدة",
    messages: [],
    created_at: new Date().toISOString()
  };
  conversations.unshift(c);
  activeId = c.id;
  saveLocal();
  renderAll();
}

function activeConversation() {
  return conversations.find(c => c.id === activeId);
}

function renderHistory() {
  const box = $("history");
  box.replaceChildren();

  if (!conversations.length) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "لا توجد محادثات بعد.";
    box.appendChild(p);
    return;
  }

  conversations.forEach(c => {
    const line = document.createElement("div");
    line.className = "history-item";

    const open = document.createElement("button");
    open.textContent = c.title || "محادثة جديدة";
    open.onclick = () => {
      activeId = c.id;
      renderAll();
    };

    const del = document.createElement("button");
    del.textContent = "حذف";
    del.onclick = () => {
      if (!confirm("هل تريد حذف هذه المحادثة؟")) return;
      conversations = conversations.filter(x => x.id !== c.id);
      if (activeId === c.id) activeId = conversations[0]?.id || null;
      saveLocal();
      renderAll();
    };

    line.append(open, del);
    box.appendChild(line);
  });
}

function renderMessages() {
  const box = $("messages");
  box.replaceChildren();
  const c = activeConversation();

  $("chatTitle").textContent = c?.title || "محادثة جديدة";

  if (!c || !c.messages.length) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "ابدأ محادثة جديدة بكتابة رسالتك.";
    box.appendChild(p);
    return;
  }

  c.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "message " +
      (m.role === "user" ? "user" : "assistant");
    div.textContent = m.content;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function renderAll() {
  renderHistory();
  renderMessages();
}

function setupSupabase() {
  if (!window.supabase?.createClient) {
    throw new Error("تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت.");
  }
  if (
    !SUPABASE_PUBLISHABLE_KEY ||
    SUPABASE_PUBLISHABLE_KEY.includes("ضع_مفتاح")
  ) {
    throw new Error("لم تضع مفتاح Supabase الصحيح داخل الكود.");
  }
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
}

async function signUp() {
  try {
    setupSupabase();
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) {
      $("authStatus").textContent = "أدخل البريد الإلكتروني وكلمة المرور.";
      return;
    }
    $("authStatus").textContent = "جارٍ إنشاء الحساب...";
    const {data, error} = await supabaseClient.auth.signUp({
      email, password
    });
    if (error) throw error;

    if (!data.session) {
      $("authStatus").textContent =
        "تم إرسال طلب التسجيل. تحقق من بريدك الإلكتروني لتأكيد الحساب.";
      return;
    }
    currentUser = data.user;
    await startApp();
  } catch (e) {
    $("authStatus").textContent = "تعذر إنشاء الحساب: " + escapeError(e);
  }
}

async function signIn() {
  try {
    setupSupabase();
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) {
      $("authStatus").textContent = "أدخل البريد الإلكتروني وكلمة المرور.";
      return;
    }
    $("authStatus").textContent = "جارٍ تسجيل الدخول...";
    const {data, error} = await supabaseClient.auth.signInWithPassword({
      email, password
    });
    if (error) throw error;
    currentUser = data.user;
    await startApp();
  } catch (e) {
    $("authStatus").textContent = "تعذر تسجيل الدخول: " + escapeError(e);
  }
}

async function startApp() {
  showApp();
  conversations = loadLocal();
  activeId = conversations[0]?.id || null;
  if (!activeId) newConversation();
  renderAll();
  await loadCloudConversations();
}

async function loadCloudConversations() {
  if (!supabaseClient || !currentUser) return;
  try {
    const {data: rows, error} = await supabaseClient
      .from("conversations")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", {ascending: false});

    if (error) throw error;
    if (!rows?.length) return;

    const cloud = [];
    for (const row of rows) {
      const {data: msgs, error: msgError} = await supabaseClient
        .from("messages")
        .select("*")
        .eq("conversation_id", row.id)
        .order("created_at", {ascending: true});

      if (msgError) throw msgError;
      cloud.push({
        id: row.id,
        title: row.title || "محادثة جديدة",
        created_at: row.created_at,
        messages: (msgs || []).map(m => ({
          role: m.role,
          content: m.content
        }))
      });
    }

    // لا تستبدل محادثة محلية تحمل رسائل غير محفوظة.
    for (const c of cloud) {
      const index = conversations.findIndex(x => x.id === c.id);
      if (index < 0) conversations.push(c);
      else if (!conversations[index].messages?.length) conversations[index] = c;
    }

    saveLocal();
    if (!activeId || !conversations.some(c => c.id === activeId)) {
      activeId = conversations[0]?.id || null;
    }
    renderAll();
  } catch (e) {
    status("تعذر تحميل المحادثات السحابية: " + escapeError(e));
  }
}

async function saveConversationToCloud(c) {
  if (!supabaseClient || !currentUser || !c) return;
  try {
    const {error: convError} = await supabaseClient
      .from("conversations")
      .upsert({
        id: c.id,
        user_id: currentUser.id,
        title: c.title || "محادثة جديدة"
      }, {onConflict: "id"});

    if (convError) throw convError;

    // يستخدم هذا الإصدار الرسائل الجديدة فقط عند إرسالها.
    // لا يحذف الرسائل الموجودة في قاعدة البيانات.
    if (c._pendingMessages?.length) {
      const rows = c._pendingMessages.map(m => ({
        conversation_id: c.id,
        user_id: currentUser.id,
        role: m.role,
        content: m.content
      }));

      const {error: msgError} = await supabaseClient
        .from("messages")
        .insert(rows);

      if (msgError) throw msgError;
      c._pendingMessages = [];
    }
  } catch (e) {
    status("تم الحفظ محليًا، لكن المزامنة السحابية لم تنجح: " +
      escapeError(e));
  }
}

async function sendMessage() {
  if (busy) return;
  const text = $("prompt").value.trim();
  if (!text) return;

  if (!activeConversation()) newConversation();
  const c = activeConversation();
  if (!c) return;

  busy = true;
  $("send").disabled = true;
  $("prompt").value = "";
  status("جارٍ إرسال الرسالة...");

  const userMessage = {role: "user", content: text};
  c.messages.push(userMessage);
  c._pendingMessages = c._pendingMessages || [];
  c._pendingMessages.push(userMessage);

  if (c.title === "محادثة جديدة") {
    c.title = text.slice(0, 45);
  }
  saveLocal();
  renderAll();

  try {
    await saveConversationToCloud(c);

    const history = c.messages.map(m => ({
      role: m.role,
      content: m.content
    }));

    const response = await fetch(AI_API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history})
    });

    const raw = await response.text();
    if (!response.ok) {
      throw new Error("خادم الذكاء الاصطناعي: HTTP " + response.status);
    }

    let answer = raw;
    try {
      const data = JSON.parse(raw);
      answer = data.reply || data.answer || data.response ||
        data.message || raw;
    } catch {}

    const botMessage = {role: "assistant", content: String(answer)};
    c.messages.push(botMessage);
    c._pendingMessages = c._pendingMessages || [];
    c._pendingMessages.push(botMessage);

    saveLocal();
    renderAll();
    await saveConversationToCloud(c);
    status("تم الرد.");
  } catch (e) {
    status("تعذر الحصول على الرد: " + escapeError(e));
    saveLocal();
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

$("signup").addEventListener("click", signUp);
$("login").addEventListener("click", signIn);
$("send").addEventListener("click", sendMessage);

$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

$("newChat").addEventListener("click", newConversation);

$("clearChat").addEventListener("click", () => {
  const c = activeConversation();
  if (!c) return;
  if (!confirm("هل تريد مسح رسائل هذه المحادثة؟")) return;
  c.messages = [];
  c._pendingMessages = [];
  saveLocal();
  renderAll();
});

$("logout").addEventListener("click", async () => {
  if (supabaseClient) await supabaseClient.auth.signOut();
  currentUser = null;
  showAuth("تم تسجيل الخروج.");
});

(async function init() {
  try {
    setupSupabase();
    const {data, error} = await supabaseClient.auth.getSession();
    if (error) throw error;
    if (data.session) {
      currentUser = data.session.user;
      await startApp();
    } else {
      showAuth();
    }
  } catch (e) {
    showAuth("إعداد الاتصال يحتاج إلى مراجعة: " + escapeError(e));
  }
})();
</script>
</body>
</html>
